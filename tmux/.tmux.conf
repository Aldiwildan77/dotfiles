# tmux — the Linux manifests install it, so it needs a config that matches the
# rest of the setup. Palette is Flexoki Dark, same as vim and yazi.

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # true colour passthrough
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10                       # don't swallow ESC in vim
set -g focus-events on
set -g renumber-windows on

# Count from 1 — the 0 key is too far away.
set -g base-index 1
setw -g pane-base-index 1

# ---------------------------------------------------------------------------
# Key bindings
# ---------------------------------------------------------------------------
# C-a over the default C-b: easier to reach, and matches screen.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display "reloaded"

# Split keeping the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim-style pane movement and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vi keys in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---------------------------------------------------------------------------
# Appearance — Flexoki Dark
# ---------------------------------------------------------------------------
set -g status-position bottom
set -g status-style "bg=default,fg=#878681"
set -g status-left  "#[fg=#4385BE,bold] #S #[default]"
set -g status-right "#[fg=#575653]%d/%m #[fg=#878681]%H:%M "
set -g status-left-length 30

setw -g window-status-format         "#[fg=#575653] #I:#W "
setw -g window-status-current-format "#[fg=#D0A215,bold] #I:#W "

set -g pane-border-style        "fg=#343331"
set -g pane-active-border-style "fg=#575653"
set -g message-style            "bg=default,fg=#D0A215"
